[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfjin-pdf-to-word"
version = "0.1.0"
authors = [
  { name="PDFJin Team", email="support@pdfjin.com" },
]
description = "Convert PDF documents to editable Microsoft Word DOCX by PDFJin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pdf", "pdfjin", "cli", "pdf-tools", "document-processing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["pdf2docx>=0.5.6", "pikepdf>=8.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://pdfjin.com"
"Online Tool" = "https://pdfjin.com/pages/pdf-to-word.html"
"Source" = "https://github.com/pdfjin/pdfjin-pdf-to-word"
"Bug Tracker" = "https://github.com/pdfjin/pdfjin-pdf-to-word/issues"

[project.scripts]
pdfjin-pdf-to-word = "pdfjin_pdf_to_word.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfjin_pdf_to_word*"]
